name: Validate public Skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reader and check committed output
        run: |
          python3 scripts/build_reader.py
          git diff --exit-code -- site guide
      - name: Check publication allowlist, sensitive data and manifest
        run: python3 scripts/verify_publication.py
      - name: Verify citations and file references
        run: python3 scripts/verify_bundle.py
      - name: Run evidence and publication tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify decision guide and reader links
        run: python3 scripts/verify_guide.py
